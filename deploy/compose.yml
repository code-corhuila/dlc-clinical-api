name: dlc-clinical-api

services:
  clinical-api:
    image: dlc-clinical-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - platform

networks:
  platform:
    external: true
