# Clinical API, its outbox relay, its inbox consumer and its intent reconciler. The shared MongoDB instance belongs to dlc-infra-mongo and the
# Clinical schema to dlc-clinical-db; this file never defines a database or volume.
name: dlc-clinical-api
services:
  clinical-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    expose: ["8080"]
    networks: [platform]
  # Publishes committed outbox events (Norma 5.3.11): same image, separate process.
  clinical-outbox-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/clinical-outbox-relay"]
    env_file: ../.env
    networks: [platform]
  # Applies AppointmentCompleted and EncounterChargesCompleted to the encounter closure.
  clinical-inbox-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/clinical-inbox-consumer"]
    env_file: ../.env
    networks: [platform]
  # Settles write intents left PENDING by a lost owner answer or a crash (ADR-017).
  clinical-intent-reconciler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/clinical-intent-reconciler"]
    env_file: ../.env
    networks: [platform]
networks:
  platform:
    name: ${PLATFORM_NETWORK_NAME:-platform}
    external: true
